name: Build go and Release

on:
  push:
    branches: [main]
    paths:
      - 'go/**'
      - '.github/workflows/build.yml'
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [main]
    paths:
      - 'go/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: go/go.sum

      - name: Run tests
        run: go test -v ./...

  build:
    name: Build all platforms
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: go/go.sum

      - name: Build
        working-directory: go
        env:
          CGO_ENABLED: 0
        run: |
          mkdir -p ../dist

          GOOS=linux   GOARCH=amd64 go build -ldflags="-s -w" -trimpath -o ../dist/token-worker-linux-amd64 .
          GOOS=linux   GOARCH=arm64 go build -ldflags="-s -w" -trimpath -o ../dist/token-worker-linux-arm64 .
          GOOS=darwin  GOARCH=amd64 go build -ldflags="-s -w" -trimpath -o ../dist/token-worker-darwin-amd64 .
          GOOS=darwin  GOARCH=arm64 go build -ldflags="-s -w" -trimpath -o ../dist/token-worker-darwin-arm64 .
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -trimpath -o ../dist/token-worker-windows-amd64.exe .

          ls -lh ../dist/

      - name: Create/Update latest Release (main push)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          body: |
            Auto-built from `main` @ ${{ github.sha }}
            
            Commit: ${{ github.event.head_commit.message }}
            Date: ${{ github.event.head_commit.timestamp }}
            
            > 日常滚动构建，非稳定版本。稳定版本请查看 [Releases](https://github.com/${{ github.repository }}/releases)。
          files: dist/*
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create versioned Release (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
