name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Wrangler
        run: npm install -g wrangler@3

      - name: Patch wrangler.toml with vars
        env:
          DB_ID: ${{ steps.d1.outputs.db_id }}
          NODE_ID: ${{ vars.WORKER_NODE_ID }}
          REMOTETOKEN: ${{ vars.REMOTETOKEN }}
        run: |
          # 注入 database_id（若已有占位符）
          if [ -n "$DB_ID" ]; then
            sed -i "s/REPLACE_WITH_YOUR_DATABASE_ID/$DB_ID/" wrangler.toml
          fi

          # 注入 WORKER_NODE_ID
          if [ -n "$NODE_ID" ]; then
            TRIMMED_NODE_ID=$(echo "$NODE_ID" | xargs)
            sed -i "s|^WORKER_NODE_ID = .*|WORKER_NODE_ID = \"$TRIMMED_NODE_ID\"|" wrangler.toml
          fi

          # 注入 REMOTETOKEN（JSON.stringify 转义，最健壮）
          if [ -n "$REMOTETOKEN" ]; then
            node -e '
              const fs = require("fs");
              let t = fs.readFileSync("wrangler.toml", "utf8");
              let val = process.env.REMOTETOKEN.trim();
              const tomlValue = JSON.stringify(val);
              t = t.replace(/^REMOTETOKEN = .*$/m, "REMOTETOKEN = " + tomlValue);
              fs.writeFileSync("wrangler.toml", t);
            '
          fi

          echo "=== wrangler.toml ==="
          cat wrangler.toml
          echo "=== 第 7 行字节 ==="
          sed -n '7p' wrangler.toml | od -c | head -10

      - name: Validate wrangler.toml
        run: |
          node -e "
            const fs = require('fs');
            const lines = fs.readFileSync('wrangler.toml', 'utf8').split('\n');
            const line = lines.find(l => l.startsWith('REMOTETOKEN'));
            if (!line) { console.error('❌ 未找到 REMOTETOKEN'); process.exit(1); }
            if (!/^REMOTETOKEN = \".*\"$/.test(line)) {
              console.error('❌ REMOTETOKEN 格式错误:', JSON.stringify(line));
              process.exit(1);
            }
            console.log('✅ REMOTETOKEN 格式正确');
          "
