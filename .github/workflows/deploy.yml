name: Initial Deploy to Cloudflare Workers

on:
  workflow_dispatch:   # 仅手动触发，push 不触发

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Initial Deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Wrangler
        run: npm install -g wrangler@3

      - name: Verify required secrets
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          API_KEY: ${{ secrets.API_KEY }}
          SHARED_SECRET: ${{ secrets.WORKER_SHARED_SECRET }}
          NODE_ID: ${{ vars.WORKER_NODE_ID }}
        run: |
          missing=0
          for v in CF_API_TOKEN CF_ACCOUNT_ID API_KEY SHARED_SECRET NODE_ID; do
            if [ -z "${!v}" ]; then
              echo "❌ 缺少配置：$v"
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then
            echo ""
            echo "请在 GitHub 仓库 Settings → Secrets and variables → Actions 中配置："
            echo "  Secrets:"
            echo "    CLOUDFLARE_API_TOKEN"
            echo "    CLOUDFLARE_ACCOUNT_ID"
            echo "    API_KEY"
            echo "    WORKER_SHARED_SECRET"
            echo "  Variables:"
            echo "    WORKER_NODE_ID"
            echo "    REMOTETOKEN (可选)"
            exit 1
          fi
          echo "✅ 配置检查通过"

      - name: Ensure D1 database exists
        id: d1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          DB_NAME="tts-db"
          echo "🔍 查询 D1 数据库: $DB_NAME"
          LIST_JSON=$(wrangler d1 list --json 2>/dev/null || echo "[]")
          DB_ID=$(echo "$LIST_JSON" | node -e "
            const data = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            const found = data.find(d => d.name === '$DB_NAME');
            console.log(found ? found.uuid : '');
          ")
          if [ -z "$DB_ID" ]; then
            echo "📦 创建 D1 数据库: $DB_NAME"
            CREATE_OUT=$(wrangler d1 create "$DB_NAME" 2>&1)
            echo "$CREATE_OUT"
            DB_ID=$(echo "$CREATE_OUT" | grep -oE 'database_id = "[^"]+"' | head -1 | sed 's/database_id = "//;s/"//')
          fi
          if [ -z "$DB_ID" ]; then
            echo "❌ 无法获取 database_id"
            exit 1
          fi
          echo "✅ database_id: $DB_ID"
          echo "db_id=$DB_ID" >> "$GITHUB_OUTPUT"

      - name: Patch wrangler.toml with database_id
        env:
          DB_ID: ${{ steps.d1.outputs.db_id }}
          NODE_ID: ${{ vars.WORKER_NODE_ID }}
          REMOTETOKEN: ${{ vars.REMOTETOKEN }}
        run: |
          sed -i "s/REPLACE_WITH_YOUR_DATABASE_ID/$DB_ID/" wrangler.toml
          if [ -n "$NODE_ID" ]; then
            sed -i "s|^WORKER_NODE_ID = .*|WORKER_NODE_ID = \"$NODE_ID\"|" wrangler.toml
          fi
          if [ -n "$REMOTETOKEN" ]; then
            node -e "
              const fs = require('fs');
              let t = fs.readFileSync('wrangler.toml', 'utf8');
              const escaped = process.env.REMOTETOKEN.replace(/\\\\/g, '\\\\\\\\').replace(/\\\"/g, '\\\\\"');
              t = t.replace(/^REMOTETOKEN = .*$/m, 'REMOTETOKEN = \"' + escaped + '\"');
              fs.writeFileSync('wrangler.toml', t);
            "
          fi
          echo "✅ wrangler.toml 已更新"
          cat wrangler.toml

      - name: Initialize D1 schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler d1 execute tts-db --remote --file=schema.sql
          echo "✅ D1 表结构已初始化"

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Set Worker Secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          API_KEY: ${{ secrets.API_KEY }}
          SHARED_SECRET: ${{ secrets.WORKER_SHARED_SECRET }}
        run: |
          echo "🔐 设置 Worker Secrets..."
          echo "$API_KEY" | wrangler secret put API_KEY
          echo "$SHARED_SECRET" | wrangler secret put WORKER_SHARED_SECRET
          echo "✅ Secrets 已设置"

      - name: Summary
        env:
          NODE_ID: ${{ vars.WORKER_NODE_ID }}
        run: |
          echo "## ✅ 首次部署完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 项 | 值 |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Worker | \`tts-worker\` |" >> $GITHUB_STEP_SUMMARY
          echo "| D1 | \`tts-db\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 节点 ID | \`$NODE_ID\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 下一步：配置 Cloudflare Dashboard 自动部署" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "1. 访问 Cloudflare Dashboard → Workers & Pages → tts-worker" >> $GITHUB_STEP_SUMMARY
          echo "2. Settings → Builds & deployments → Connect Git" >> $GITHUB_STEP_SUMMARY
          echo "3. 选择仓库，Build command 留空，Deploy command: \`npx wrangler deploy\`" >> $GITHUB_STEP_SUMMARY
          echo "4. 后续 push 到 main 将由 Cloudflare 自动部署" >> $GITHUB_STEP_SUMMARY
