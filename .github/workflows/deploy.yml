name: Deploy to Cloudflare Workers

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Wrangler
        run: npm install -g wrangler@4

      - name: Verify Wrangler version
        run: wrangler --version

      - name: Verify required secrets
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          API_KEY: ${{ secrets.API_KEY }}
          SHARED_SECRET: ${{ secrets.WORKER_SHARED_SECRET }}
          NODE_ID: ${{ vars.WORKER_NODE_ID }}
        run: |
          missing=0
          for v in CF_API_TOKEN CF_ACCOUNT_ID API_KEY SHARED_SECRET NODE_ID; do
            if [ -z "${!v}" ]; then
              echo "❌ 缺少配置：$v"
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then
            echo ""
            echo "请在 GitHub 仓库 Settings → Secrets and variables → Actions 中配置："
            echo "  Secrets:"
            echo "    CLOUDFLARE_API_TOKEN"
            echo "    CLOUDFLARE_ACCOUNT_ID"
            echo "    API_KEY"
            echo "    WORKER_SHARED_SECRET"
            echo "  Variables:"
            echo "    WORKER_NODE_ID"
            echo "    REMOTETOKEN (可选，多节点时填写)"
            exit 1
          fi
          echo "✅ 配置检查通过"

      - name: Ensure D1 database exists
        id: d1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          DB_NAME="tts-db"
          echo "🔍 查询 D1 数据库: $DB_NAME"

          LIST_RAW=$(wrangler d1 list --json 2>&1 || true)
          echo "=== d1 list 原始输出 ==="
          echo "$LIST_RAW"

          LIST_JSON=$(echo "$LIST_RAW" | sed -n '/^\[/,$p')
          if [ -z "$LIST_JSON" ]; then
            LIST_JSON="[]"
          fi

          if ! echo "$LIST_JSON" | node -e "JSON.parse(require('fs').readFileSync(0,'utf8'))" 2>/dev/null; then
            echo "⚠️ d1 list 输出非合法 JSON，使用空数组"
            LIST_JSON="[]"
          fi

          DB_ID=$(echo "$LIST_JSON" | node -e "
            try {
              const data = JSON.parse(require('fs').readFileSync(0, 'utf8'));
              const found = data.find(d => d.name === '$DB_NAME');
              console.log(found ? found.uuid : '');
            } catch (e) {
              console.log('');
            }
          ")

          if [ -z "$DB_ID" ]; then
            echo "📦 尝试创建 D1 数据库: $DB_NAME"
            CREATE_OUT=$(wrangler d1 create "$DB_NAME" 2>&1 || true)
            echo "=== d1 create 输出 ==="
            echo "$CREATE_OUT"

            if echo "$CREATE_OUT" | grep -qi "already exists"; then
              echo "ℹ️ 数据库已存在，从 d1 list 文本输出提取 ID"
              DB_ID=$(echo "$LIST_RAW" | grep -oE "$DB_NAME[[:space:]]+[a-f0-9-]{32,}" | grep -oE "[a-f0-9-]{32,}" | head -1)
            else
              DB_ID=$(echo "$CREATE_OUT" | grep -oE 'database_id = "[^"]+"' | head -1 | sed 's/database_id = "//;s/"//')
            fi
          fi

          if [ -z "$DB_ID" ]; then
            echo "❌ 无法获取 database_id"
            echo "=== 最终 d1 list 输出 ==="
            wrangler d1 list 2>&1 || true
            exit 1
          fi

          echo "✅ database_id: $DB_ID"
          echo "db_id=$DB_ID" >> "$GITHUB_OUTPUT"

      - name: Patch wrangler.toml with vars
        env:
          DB_ID: ${{ steps.d1.outputs.db_id }}
          NODE_ID: ${{ vars.WORKER_NODE_ID }}
          REMOTETOKEN: ${{ vars.REMOTETOKEN }}
        run: |
          sed -i "s/REPLACE_WITH_YOUR_DATABASE_ID/$DB_ID/" wrangler.toml

          if [ -n "$NODE_ID" ]; then
            TRIMMED_NODE_ID=$(echo "$NODE_ID" | xargs)
            sed -i "s|^WORKER_NODE_ID = .*|WORKER_NODE_ID = \"$TRIMMED_NODE_ID\"|" wrangler.toml
          fi

          if [ -n "$REMOTETOKEN" ]; then
            node -e '
              const fs = require("fs");
              let t = fs.readFileSync("wrangler.toml", "utf8");
              let val = process.env.REMOTETOKEN.trim();
              val = val.replace(/\\r\\n/g, " ")
                       .replace(/\\n/g, " ")
                       .replace(/\r?\n/g, " ")
                       .replace(/\s+/g, " ")
                       .trim();
              const tomlValue = JSON.stringify(val);
              t = t.replace(/^REMOTETOKEN = .*$/m, "REMOTETOKEN = " + tomlValue);
              fs.writeFileSync("wrangler.toml", t);
            '
          fi

          echo "✅ wrangler.toml 已更新"
          cat wrangler.toml

      - name: Initialize D1 schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler d1 execute tts-db --file=schema.sql
          echo "✅ D1 表结构已初始化"

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler deploy

      - name: Set Worker Secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          API_KEY: ${{ secrets.API_KEY }}
          SHARED_SECRET: ${{ secrets.WORKER_SHARED_SECRET }}
        run: |
          echo "🔐 设置 Worker Secrets..."
          echo "$API_KEY" | wrangler secret put API_KEY
          echo "$SHARED_SECRET" | wrangler secret put WORKER_SHARED_SECRET
          echo "✅ Secrets 已设置"

      - name: Summary
        env:
          NODE_ID: ${{ vars.WORKER_NODE_ID }}
        run: |
          echo "## ✅ 部署完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 项 | 值 |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Worker | \`tts-cf\` |" >> $GITHUB_STEP_SUMMARY
          echo "| D1 | \`tts-db\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 节点 ID | \`$NODE_ID\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Placement | \`azure:southeastasia\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "访问：https://tts-cf.<subdomain>.workers.dev" >> $GITHUB_STEP_SUMMARY
